# BEACON Field Index for Rule and Form Authoring
# Extracted from: Meta Dictionary v5 / canonical-reference.json
# Purpose: Compact agentic-ready reference. Rules and forms import field refs from here.
# Source of truth: contracts/meta-dictionary-v5.xlsx (beacon-review repo)
# Generated: 2026-03-01
# Status: In-flight (172 fields mapped; meta dictionary audit ongoing)
#
# Usage by agents:
#   1. UWR-XXX.yaml files reference fields as: entity.attribute (e.g., Location.state)
#   2. FORM-XXX.yaml files reference fields the same way
#   3. Agents resolve field metadata (type, priority, resolution) from this index
#   4. Multi-source fields require enrichment orchestration per resolution_rule

version: "5.0"
extracted_from: "contracts/meta-dictionary-v5.xlsx"
entity_count: 14
field_count: 172

# Source priority chain (global)
priority_chain:
  - rank: P1
    source: Submission Triage
    role: Insured-provided data from submission intake
    authority: Wins over all other sources when value IS NOT NULL
  - rank: P2
    source: Nearmap
    role: Aerial imagery / property intelligence
    authority: Wins when Submission Triage value is NULL
  - rank: CPSF_DEFAULT
    source: Federato CPSF
    role: Replacement cost calculation
    authority: Default for building value; overridden ONLY IF E2Value > CPSF
  - rank: Conditional
    source: E2Value
    role: Third-party replacement cost estimator
    authority: Overrides CPSF for building value fields ONLY WHEN E2Value > CPSF
  - rank: Downstream
    source: AIR/Touchstone
    role: Downstream catastrophe model (3rd party API within Federato)
    authority: No override. Enrichment only.

