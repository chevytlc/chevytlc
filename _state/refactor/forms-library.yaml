reference:
- section: DISPOSITION TYPES
  term: Disposition
  definition: Definition
  example: Example
- section: DISPOSITION TYPES
  term: Mandatory
  definition: Always attached to every transaction. No underwriter discretion.
  example: OFAC Notice, Common Policy Conditions
- section: DISPOSITION TYPES
  term: Conditional-Mandatory
  definition: Attached when a specific condition is met. No underwriter discretion once triggered.
  example: Texas Changes (when SL Home State = TX)
- section: DISPOSITION TYPES
  term: Default-On/Removable
  definition: Attached by default. Underwriter may remove with documented reason.
  example: Cosmetic Roof Damage Endorsement
- section: DISPOSITION TYPES
  term: Default-Off/Addable
  definition: Not attached by default. Underwriter may add at discretion.
  example: Roof Exclusion, Protective Safeguards
- section: DISPOSITION TYPES
  term: Excluded
  definition: Not available for current phase. Held for future implementation.
  example: Following Form, Excess Coverage Form
- section: DISPOSITION TYPES
  term: TBD
  definition: Disposition not yet determined by CUO. Requires decision before go-live.
  example: ''
- section: SOURCE TYPES
  term: Source Type
  definition: Definition
  example: ''
- section: SOURCE TYPES
  term: ISO
  definition: Insurance Services Office standard form. Referenced by ISO form number (e.g., CP 00 10 10 12).
  example: ''
- section: SOURCE TYPES
  term: Bureau
  definition: Industry bureau form (e.g., LMA, AAIS). Referenced by bureau form number.
  example: ''
- section: SOURCE TYPES
  term: Proprietary
  definition: LRMGA-drafted form. Uses LR numbering convention (e.g., LR 00 01 24).
  example: ''
- section: SOURCE TYPES
  term: TBD
  definition: Source not yet determined. Needs research to identify whether ISO form exists or proprietary draft needed.
  example: ''
- section: CONDITION OPERATORS
  term: Operator
  definition: Meaning
  example: ''
- section: CONDITION OPERATORS
  term: equals
  definition: Field value exactly matches the specified value
  example: ''
- section: CONDITION OPERATORS
  term: not_equals
  definition: Field value does not match the specified value
  example: ''
- section: CONDITION OPERATORS
  term: in_list
  definition: Field value matches any item in a comma-separated list
  example: ''
- section: CONDITION OPERATORS
  term: greater_than
  definition: Field value exceeds the specified threshold
  example: ''
- section: CONDITION OPERATORS
  term: less_than
  definition: Field value is below the specified threshold
  example: ''
- section: READINESS GATE DEFINITIONS
  term: Gate
  definition: Definition
  example: How to Verify
- section: READINESS GATE DEFINITIONS
  term: Form Content Ready
  definition: The actual form document (PDF/Word) exists, has been reviewed, and is approved for use.
  example: PM confirms file exists and is current version
- section: READINESS GATE DEFINITIONS
  term: Rule Logic Defined
  definition: CUO has specified the disposition, conditions, and transaction scope.
  example: Disposition is not TBD; conditions are complete if Conditional-Mandatory
- section: READINESS GATE DEFINITIONS
  term: Federato Configured
  definition: The attachment rule has been implemented in Federato and is functioning.
  example: PM confirms with Federato engineering
- section: READINESS GATE DEFINITIONS
  term: Tested/Validated
  definition: Form appears correctly in test policy output under all applicable conditions.
  example: QA pass on quote, binder, policy, and endorsement workflows
- section: LRMGA FORM NUMBERING CONVENTION
  term: 'Format:'
  definition: LR [category] [sequence] [edition] - e.g., LR 00 01 24
  example: ''
- section: LRMGA FORM NUMBERING CONVENTION
  term: 'Prefix:'
  definition: LR = Lighthouse Risk (proprietary forms). ISO/Bureau forms retain their original numbers.
  example: ''
- section: LRMGA FORM NUMBERING CONVENTION
  term: 'Note:'
  definition: LRMGA SOV prefix used for Schedule of Values forms.
  example: ''
