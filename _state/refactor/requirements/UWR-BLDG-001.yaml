# BEACON Rule Artifact: BLDG-001
# Year Built Eligibility
# Schema refs: _state/refactor/schema/field-index.yaml

requirement_id: UWR-BLDG-001
title: Year Built Eligibility and Referral Thresholds
version: 1.0.0
status: Draft

source:
  type: carrier_da
  document: LRMGA Binding Authority Agreement
  section: Building Age Requirements
  effective_date: 2025-01-01
  expiration_date: null
  verbatim: "[TODO: Extract verbatim from DA - year built requirements]"

beacon_alignment:
  layer: Control
  enforcement_tier: Gated Referral
  override_authority: Chief Underwriting Officer
  failure_prevented: >
    Binding aged buildings without appropriate underwriting scrutiny;
    missing update history that affects loss potential

domain: appetite

rule:
  statement: >
    Buildings with year_built indicating age beyond carrier threshold require
    senior UW referral. Buildings beyond hard-decline age are ineligible.
    When year_built is unavailable from submission, Nearmap enrichment provides
    fallback per source priority rules.
  logic: |
    # Resolve year_built per source priority
    year_built = RESOLVE(Building.year_built)
    # Source priority: P1 Submission Triage > P2 Nearmap

    building_age = CURRENT_YEAR - year_built

    IF building_age > CARRIER_PARAM.max_building_age
    THEN decline = TRUE
         decline_reason = "Building age exceeds maximum ({building_age} years)"

    ELSE IF building_age > CARRIER_PARAM.referral_building_age
    THEN referral = TRUE
         referral_reason = "Building age requires senior UW review ({building_age} years)"
         require_fields = ['plumbing_update_year', 'electrical_update_year', 'roof_update_year']
  scope:
    lifecycle_phase: Risk Assessment
    peril: All
    geography: All (excl AK, HI per ELIG-001)
    occupancy: All
    construction: All
    limit_range: All
  parameters:
    - name: CARRIER_PARAM.max_building_age
      type: INTEGER
      description: Maximum building age (hard decline)
      current_value: "[TODO: Populate from DA]"
      source: Binding Authority Agreement
    - name: CARRIER_PARAM.referral_building_age
      type: INTEGER
      description: Building age triggering referral
      current_value: "[TODO: Populate from DA]"
      source: Binding Authority Agreement

data_requirements:
  fields:
    - name: Building.year_built
      type: INTEGER
      source: SOV
      priority: P1
      enrichment_provider: Nearmap (P2 fallback)
      required_at_phase: Risk Assessment
    - name: Building.construction_type
      type: CHARACTER_VARYING
      source: SOV
      priority: P1
      enrichment_provider: null
      required_at_phase: Risk Assessment
    - name: Building.roof_condition_score
      type: DOUBLE_PRECISION
      source: Enrichment
      priority: P2
      enrichment_provider: Nearmap
      required_at_phase: Risk Assessment

  enrichment_dependencies:
    - provider: Nearmap
      data_elements: [year_built, roof_condition_score, building_condition]
      trigger: "Building.year_built IS NULL from Submission Triage"

implementation:
  evaluation_point: Risk Assessment - after enrichment, before pricing
  actions:
    - condition: "building_age > CARRIER_PARAM.max_building_age"
      action: Block Transaction
    - condition: "building_age > CARRIER_PARAM.referral_building_age"
      action: Route to Referral
  user_feedback: >
    Building age ({building_age} years) requires review. Buildings built
    before {max_year} are ineligible. Buildings built before {referral_year}
    require CUO approval with documented update history.
  sequential_dependencies:
    - UWR-ELIG-001  # Geography check
    - UWR-ELIG-002  # TIV check

federato_mapping:
  athena_rule_id: "[TODO: Assign]"
  tables: [operations_building]
  fields: [year_built, construction_type]
  workflow_stage: Risk Assessment
  field_mapping:
    - artifact_field: Building.year_built
      federato_field: year_built
      federato_table: operations_building
    - artifact_field: Building.construction_type
      federato_field: construction_type
      federato_table: operations_building
  notes: >
    Multi-source field. Federato must implement source priority resolution:
    Submission Triage (P1) > Nearmap (P2).

lifecycle:
  owner: Chief Underwriting Officer
  review_cadence: Annually
  next_review_date: "[TODO]"
  sunset_trigger: Carrier updates building age guidelines
  last_reviewed: null
  last_reviewed_by: null
  change_history:
    - version: 1.0.0
      date: 2026-03-01
      author: CTOO
      description: Initial creation from agentic refactor Phase 1
