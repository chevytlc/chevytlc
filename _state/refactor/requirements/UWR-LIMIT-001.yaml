# BEACON Rule Artifact: LIMIT-001
# Per-Location and Per-Occurrence Limit Boundaries
# Schema refs: _state/refactor/schema/field-index.yaml

requirement_id: UWR-LIMIT-001
title: Per-Location and Per-Occurrence Limit Boundaries
version: 1.0.0
status: Draft

source:
  type: carrier_da
  document: LRMGA Binding Authority Agreement
  section: Capacity Limits
  effective_date: 2025-01-01
  expiration_date: null
  verbatim: "[TODO: Extract verbatim from DA - limit boundaries]"

beacon_alignment:
  layer: Control
  enforcement_tier: Hard Block
  override_authority: null
  failure_prevented: >
    Exceeding delegated authority limits; binding capacity beyond what
    carrier has authorized

domain: pricing

rule:
  statement: >
    No single location may have a building_limit exceeding the carrier's
    per-location maximum. Policy-level TIV may not exceed per-occurrence
    limit. Building limit determination follows source priority: submitted
    limit (P1) is used when available; if missing, the higher of CPSF or
    E2Value replacement cost applies per the building value exception rules.
  logic: |
    # Per-location limit check
    FOR EACH building IN submission.buildings:
      resolved_limit = RESOLVE(Building.building_limit)
      # Priority: P1 Submission Triage > P2 Nearmap

      IF resolved_limit > CARRIER_PARAM.max_per_location_limit
      THEN decline = TRUE
           decline_reason = "Location limit ${resolved_limit} exceeds max ${CARRIER_PARAM.max_per_location_limit}"

    # Per-occurrence limit check
    IF Policy.tiv > CARRIER_PARAM.max_per_occurrence_limit
    THEN decline = TRUE
         decline_reason = "Policy TIV ${Policy.tiv} exceeds per-occurrence limit"

    # ITV check (building limit vs replacement value)
    replacement = RESOLVE(Building_Extension.total_replacement_value)
    # Resolution: IF E2Value > CPSF THEN E2Value ELSE CPSF

    itv_ratio = resolved_limit / replacement
    IF itv_ratio < CARRIER_PARAM.min_itv_ratio
    THEN referral = TRUE
         referral_reason = "ITV ratio ${itv_ratio} below minimum ${CARRIER_PARAM.min_itv_ratio}"
  scope:
    lifecycle_phase: Risk Assessment
    peril: All
    geography: All (excl AK, HI per ELIG-001)
    occupancy: All
    construction: All
    limit_range: All
  parameters:
    - name: CARRIER_PARAM.max_per_location_limit
      type: DOUBLE_PRECISION
      description: Maximum limit per location
      current_value: "[TODO: Populate from DA]"
      source: Binding Authority Agreement
    - name: CARRIER_PARAM.max_per_occurrence_limit
      type: DOUBLE_PRECISION
      description: Maximum per-occurrence limit
      current_value: "[TODO: Populate from DA]"
      source: Binding Authority Agreement
    - name: CARRIER_PARAM.min_itv_ratio
      type: DOUBLE_PRECISION
      description: Minimum insurance-to-value ratio
      current_value: "[TODO: Populate from DA - typically 0.80]"
      source: Binding Authority Agreement

data_requirements:
  fields:
    - name: Building.building_limit
      type: DOUBLE_PRECISION
      source: SOV
      priority: P1
      enrichment_provider: null
      required_at_phase: Risk Assessment
    - name: Building.tiv
      type: DOUBLE_PRECISION
      source: SOV
      priority: P1
      enrichment_provider: null
      required_at_phase: Risk Assessment
    - name: Policy.tiv
      type: DOUBLE_PRECISION
      source: SOV
      priority: P1
      enrichment_provider: null
      required_at_phase: Risk Assessment
    - name: Building_Extension.total_replacement_value
      type: DOUBLE_PRECISION
      source: Calculated
      priority: CPSF_DEFAULT
      enrichment_provider: E2Value (conditional override)
      required_at_phase: Risk Assessment
    - name: Building.contents_limit
      type: DOUBLE_PRECISION
      source: SOV
      priority: P1
      enrichment_provider: null
      required_at_phase: Risk Assessment
    - name: Building.business_income
      type: DOUBLE_PRECISION
      source: SOV
      priority: P1
      enrichment_provider: null
      required_at_phase: Risk Assessment

  enrichment_dependencies:
    - provider: E2Value
      data_elements: [total_replacement_value]
      trigger: Always (ITV calculation requires replacement cost)

implementation:
  evaluation_point: Risk Assessment - after enrichment, before pricing
  actions:
    - condition: "building_limit > max_per_location"
      action: Block Transaction
    - condition: "policy_tiv > max_per_occurrence"
      action: Block Transaction
    - condition: "itv_ratio < min_itv_ratio"
      action: Route to Referral
  user_feedback: >
    Limit exceeds delegated authority boundaries. Per-location max:
    ${max_per_location_limit}. Per-occurrence max: ${max_per_occurrence_limit}.
  sequential_dependencies:
    - UWR-ELIG-001
    - UWR-ELIG-002

federato_mapping:
  athena_rule_id: "[TODO: Assign]"
  tables: [operations_building, operations_policy, operations_building_extension]
  fields: [building_limit, tiv, total_replacement_value, contents_limit, business_income]
  workflow_stage: Risk Assessment
  field_mapping:
    - artifact_field: Building.building_limit
      federato_field: building_limit
      federato_table: operations_building
    - artifact_field: Policy.tiv
      federato_field: tiv
      federato_table: operations_policy
    - artifact_field: Building_Extension.total_replacement_value
      federato_field: total_replacement_value
      federato_table: operations_building_extension
  notes: >
    Building limit resolution: P1 Submission > P2 Nearmap.
    Replacement value resolution: CPSF default, E2Value conditional override.

