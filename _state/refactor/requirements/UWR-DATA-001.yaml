# BEACON Rule Artifact: DATA-001
# Submission Completeness Requirements
# Schema refs: _state/refactor/schema/field-index.yaml

requirement_id: UWR-DATA-001
title: Submission Completeness Requirements
version: 1.0.0
status: Draft

source:
  type: beacon_governance
  document: BEACON Operations Workflows
  section: Submission Quality Scoring - Submission Behavior
  effective_date: 2026-01-01
  expiration_date: null
  verbatim: >
    "Does the submission include required documents (ACORD, SOV, loss runs)?
    Are fields complete and internally consistent? Phase 1: deterministic
    rules. Binary: required document present or absent."

beacon_alignment:
  layer: Behavior
  enforcement_tier: Gated Referral
  override_authority: Chief Underwriting Officer
  failure_prevented: >
    Processing incomplete submissions that waste UW time and produce
    unreliable risk assessments; degrading submission behavior metrics

domain: compliance

rule:
  statement: >
    Every new business submission must include minimum required data fields
    to proceed past triage. Missing critical fields trigger hold for
    completion. Missing non-critical fields generate advisory flags.
  logic: |
    # Critical fields - submission held if missing
    critical_fields = [
      NB_Accounts.account_name,
      NB_Accounts.fein,
      NB_Accounts.effective_date,
      NB_Accounts.expiration_date,
      Location.state,
      Location.address,
      Location.zip_code,
      Building.construction_type,
      Building.year_built,
      Building.occupancy,
      Building.tiv,
      Building.building_limit,
      Policy.class_of_business,
    ]

    missing_critical = [f for f in critical_fields if f IS NULL]

    IF LEN(missing_critical) > 0
    THEN hold = TRUE
         hold_reason = "Missing required fields: {missing_critical}"
         request_completion_from_broker = TRUE

    # Important fields - advisory if missing
    important_fields = [
      Building.contents_limit,
      Building.business_income,
      Building.deductible,
      Building.sprinklered,
      Building.number_of_stories,
      Building.square_footage,
      NB_Accounts.industry_code,
      NB_Accounts.business_description,
    ]

    missing_important = [f for f in important_fields if f IS NULL]

    IF LEN(missing_important) > 0
    THEN flag = ADVISORY
         flag_reason = "Missing recommended fields: {missing_important}"
  scope:
    lifecycle_phase: Submission Ingestion
    peril: All
    geography: All
    occupancy: All
    construction: All
    limit_range: All

