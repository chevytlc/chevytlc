  enrichment_dependencies: []

implementation:
  evaluation_point: Submission Ingestion - immediate on intake
  actions:
    - condition: "Any critical field missing"
      action: Route to Referral
    - condition: "Important fields missing"
      action: Flag for Review
  user_feedback: >
    Submission incomplete. Missing required fields: {missing_critical}.
    Please request completion from broker before proceeding to risk assessment.
  sequential_dependencies: []

