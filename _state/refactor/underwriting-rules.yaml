  category: Coverage Limits
  type: Threshold
  statement: 'Coastal territories: Primary limit up to $10M per location (TIV ≤$90M)'
  logic: IF coastal_tier IN [1, 2] AND coverage_type = 'Primary' THEN max_limit = 10000000 AND max_TIV = 90000000
  source_fields: coastal_tier, coverage_type, TIV
  canonical_fields:
