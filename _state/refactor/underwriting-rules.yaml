- id: LIMIT-003
  category: Building
  type: Threshold
  statement: 'Florida dedicated limits: Frame 2002+, Joisted Masonry 1980+, Superior no restriction'
  logic: IF state = 'FL' AND coastal_tier IN [1,2] AND coverage_type = 'Dedicated' THEN IF construction = 'Frame' THEN year_built >= 2002 ELSE
    IF construction = 'Joisted Masonry' THEN year_built >= 1980
  source_fields: state, coastal_tier, construction, year_built
  canonical_fields:
  - Location.state
