- id: BLDG-001
  category: Building
  type: Soft Decline
  statement: Buildings older than 1990 require systems update within 25 years
  logic: IF year_built < 1990 AND (plumbing_update > 25 OR hvac_update > 25 OR electrical_update > 25 OR roof_update > 25) THEN referral = TRUE
  source_fields: year_built, plumbing_update_year, hvac_update_year, electrical_update_year, roof_update_year
  canonical_fields:
