# BEACON Form Artifact: FORM-DW-001
# Dwelling Property Application
# Schema refs: _state/refactor/schema/field-index.yaml
# Backlog ref: FED-02, IaC-DICT-001, IaC-DICT-003

form_id: FORM-DW-001
title: Dwelling Property Application - Intake Form
version: 1.0.0
status: Draft
form_type: application

source:
  carrier: "[TODO: Carrier name from DA]"
  document: LRMGA Binding Authority Agreement
  section: Required Application Forms
  effective_date: 2025-01-01
  mandated_by: carrier

purpose: >
  Captures insured and risk information at submission intake for dwelling
  property risks. Generates the initial data payload for triage, enrichment,
  and risk assessment of residential/dwelling exposures.

selection_logic:
  description: >
    Dwelling application is selected when policy type is dwelling/residential
    property.
  conditions:
    - field: Policy.policy_type
      operator: equals
      value: "Dwelling Property"
    - field: Policy.class_of_business
      operator: in
      values: "[TODO: Populate from carrier appetite - dwelling classes]"
  exclusions:
    - field: Location.state
      operator: in
      values: ["AK", "HI"]
      reason: "Per ELIG-001: Alaska and Hawaii excluded"

captures:
  account:
    entity: NB_Accounts
    fields:
      - attribute: account_name
        form_label: "Named Insured"
        required: true
      - attribute: fein
        form_label: "SSN / FEIN"
        required: true
        notes: "Dwelling may use SSN instead of FEIN"
      - attribute: main_address
        form_label: "Mailing Address"
        required: true
      - attribute: main_city
        form_label: "City"
        required: true
      - attribute: main_state
        form_label: "State"
        required: true
      - attribute: main_zip_code
        form_label: "ZIP Code"
        required: true
      - attribute: effective_date
        form_label: "Requested Effective Date"
        required: true
      - attribute: expiration_date
        form_label: "Requested Expiration Date"
        required: true
      - attribute: entity_type
        form_label: "Entity Type"
        required: true

  locations:
    entity: Location
    repeating: true
    min_entries: 1
    fields:
      - attribute: address
        form_label: "Property Address"
        required: true
      - attribute: city
        form_label: "City"
        required: true
      - attribute: state
        form_label: "State"
        required: true
      - attribute: zip_code
        form_label: "ZIP Code"
        required: true
      - attribute: county
        form_label: "County"
        required: false

  buildings:
    entity: Building
    repeating: true
    min_entries: 1
    parent: locations
    fields:
      - attribute: construction_type
        form_label: "Construction Type"
        required: true
        validation: "Frame, Masonry, Superior"
      - attribute: year_built
        form_label: "Year Built"
        required: true
      - attribute: number_of_stories
        form_label: "Number of Stories"
        required: true
      - attribute: square_footage
        form_label: "Total Living Area (sq ft)"
        required: true
      - attribute: building_limit
        form_label: "Dwelling Limit (Coverage A)"
        required: true
      - attribute: contents_limit
        form_label: "Personal Property Limit (Coverage C)"
        required: false
        notes: "Typically % of Coverage A"
      - attribute: tiv
        form_label: "Total Insured Value"
        required: true
      - attribute: deductible
        form_label: "All-Peril Deductible"
        required: true
      - attribute: sprinklered
        form_label: "Fire Sprinklers"
        required: false
      - attribute: roof_covering
        form_label: "Roof Type"
        required: true
        notes: "Dwelling form captures this directly; commercial form relies on enrichment"
        validation: "Asphalt Shingle, Metal, Tile, Slate, Wood Shake, Other"

  policy:
    entity: Policy
    fields:
      - attribute: policy_type
        form_label: "Policy Type"
        required: true
        pre_filled: "Dwelling Property"
      - attribute: class_of_business
        form_label: "Class of Business"
        required: true
      - attribute: program_type
        form_label: "Program"
        required: true
      - attribute: underwriting_company
        form_label: "Carrier"
        required: true
      - attribute: commission_percentage
        form_label: "Commission %"
        required: true

  broker:
    entity: Brokers
    fields:
      - attribute: text
        form_label: "Agent / Broker Name"
        required: true

triggers_rules:
  - UWR-ELIG-001  # Geography check
  - UWR-ELIG-002  # Minimum TIV
  - UWR-BLDG-001  # Year built
  - UWR-BLDG-002  # Construction type
  - UWR-LIMIT-001 # Limit boundaries
  - UWR-DATA-001  # Submission completeness

enrichment_triggers:
  - provider: Nearmap
    trigger_fields: [Location.latitude, Location.longitude]
    enriches: [Building.roof_condition_score, Building.flood_risk_score, Building.earthquake_risk_score]
  - provider: E2Value
    trigger_fields: [Location.address, Building.construction_type, Building.square_footage, Building.year_built]
    enriches: [Building_Extension.total_replacement_value]

federato_mapping:
  form_builder_id: "[TODO: From FED-02]"
  workflow_stage: Submission Intake
  tables_populated:
    - operations_nb_accounts
    - operations_location
    - operations_building
    - operations_policy
    - operations_brokers
  notes: >
    FED-02 (dwelling form config) is 85% complete.
    Awaiting coverage matrix finalization (depends on PIN-03).

lifecycle:
  owner: Chief Underwriting Officer
  review_cadence: On Source Renewal
  next_review_date: "[TODO]"
  last_reviewed: null
  change_history:
    - version: 1.0.0
      date: 2026-03-01
      author: CTOO
      description: Initial creation from agentic refactor Phase 1
